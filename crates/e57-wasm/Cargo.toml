# SPDX-License-Identifier: GPL-3.0-only
[package]
name = "e57-wasm"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "E57/LAS/LAZ decoding, octree building and point-cloud analysis, compiled to WebAssembly"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
e57 = "0.11"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
laz = { version = "0.13", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

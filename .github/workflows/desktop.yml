# SPDX-License-Identifier: GPL-3.0-only
# The desktop app for macOS, Windows and Linux.
#
# Called by build.yml on every push and by release.yml on a tag, so the two cannot disagree
# about how the thing people download is built. Nothing here is signed — see the note at the
# bottom of build.yml for exactly what to add when there are certificates.
name: desktop

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: What to call the uploaded artefacts.
        type: string
        default: e57view
      retention-days:
        type: number
        default: 14

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   name: macOS,   target: aarch64-apple-darwin }
          - { os: windows-latest, name: Windows, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-22.04,   name: Linux,   target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: ${{ matrix.target }}
      # webkit2gtk is the webview on Linux; macOS and Windows ship one with the OS
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - run: npm ci
      # the desktop bundle embeds the MCP server, and building it needs the SDK and zod
      - run: npm ci --prefix mcp
      - name: build the app
        run: npm run desktop:build -- --target ${{ matrix.target }}
      # The linker's automatic ad-hoc signature covers the Mach-O and nothing else: Info.plist
      # is not bound and there are no sealed resources, and Gatekeeper calls a bundle in that
      # state damaged rather than offering the unidentified-developer dialog. desktop/build.mjs
      # signs the bundle and the copy inside the disk image; this is the check that it did.
      - name: the macOS bundle is sealed, and Gatekeeper does not call it damaged
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          APP="desktop/target/${{ matrix.target }}/release/bundle/macos/e57view.app"
          DMG=$(ls desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          codesign -dv --verbose=2 "$APP" 2>&1 | tee /tmp/cs-app.txt
          grep -q "Sealed Resources version" /tmp/cs-app.txt
          grep -q "Info.plist entries" /tmp/cs-app.txt
          codesign --verify --deep --strict --verbose=2 "$APP"
          # and the copy people actually download, inside the image
          mkdir -p /tmp/mnt
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint /tmp/mnt
          codesign -dv --verbose=2 /tmp/mnt/e57view.app 2>&1 | tee /tmp/cs-dmg.txt
          grep -q "Sealed Resources version" /tmp/cs-dmg.txt
          codesign --verify --deep --strict --verbose=2 /tmp/mnt/e57view.app
          rm -rf /tmp/gk && mkdir -p /tmp/gk && cp -R /tmp/mnt/e57view.app /tmp/gk/
          hdiutil detach /tmp/mnt
          # what a download from a browser looks like: quarantined, and assessed by Gatekeeper.
          # "rejected" is the right answer for an app nobody has notarised, and it is the one
          # that gives the user Open Anyway. "damaged" or "no resources" is the broken seal.
          xattr -w com.apple.quarantine "0083;00000000;Safari;" /tmp/gk/e57view.app
          spctl --assess --type execute --verbose=4 /tmp/gk/e57view.app 2>&1 | tee /tmp/gk.txt || true
          if grep -qiE "damaged|no resources" /tmp/gk.txt; then
            echo "Gatekeeper still treats the bundle as broken."
            exit 1
          fi
      - name: the built binary serves the tools in mcp/tools.json
        shell: bash
        run: |
          # Windows names it e57view.exe, and the extension has to be decided from the runner
          # rather than probed: bash on Windows answers yes to `test -f e57view` when what is
          # there is e57view.exe, and then node is handed a path it cannot open.
          EXT=""
          [ "${{ runner.os }}" = "Windows" ] && EXT=".exe"
          BIN="desktop/target/${{ matrix.target }}/release/e57view$EXT"
          ls -l "$BIN"
          E57VIEW_BIN="$BIN" node test-mcp.mjs --rust
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.name }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
          path: |
            desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

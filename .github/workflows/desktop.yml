# SPDX-License-Identifier: GPL-3.0-only
# The desktop app for macOS, Windows and Linux.
#
# Called by build.yml on every push and by release.yml on a tag, so the two cannot disagree
# about how the thing people download is built. Nothing here is signed — see the note at the
# bottom of build.yml for exactly what to add when there are certificates.
name: desktop

on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: What to call the uploaded artefacts.
        type: string
        default: e57view
      retention-days:
        type: number
        default: 14

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   name: macOS,   target: aarch64-apple-darwin }
          - { os: windows-latest, name: Windows, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-22.04,   name: Linux,   target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: ${{ matrix.target }}
      # webkit2gtk is the webview on Linux; macOS and Windows ship one with the OS
      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - run: npm ci
      # the desktop bundle embeds the MCP server, and building it needs the SDK and zod
      - run: npm ci --prefix mcp
      - name: build the app
        run: npm run desktop:build -- --target ${{ matrix.target }}
      - name: the built binary serves the tools in mcp/tools.json
        shell: bash
        run: |
          BIN="desktop/target/${{ matrix.target }}/release/e57view"
          [ -f "$BIN" ] || BIN="desktop/target/${{ matrix.target }}/release/e57view.exe"
          E57VIEW_BIN="$BIN" node test-mcp.mjs --rust
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.name }}
          retention-days: ${{ inputs.retention-days }}
          if-no-files-found: error
          path: |
            desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/target/${{ matrix.target }}/release/bundle/msi/*.msi
            desktop/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

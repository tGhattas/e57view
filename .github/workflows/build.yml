# Builds the web bundle and the desktop app for macOS, Windows and Linux.
#
# Nothing here is signed. An unsigned build is honest about what it is — it will warn on first
# open, and the README says how to get past that — and signing needs secrets that belong to
# whoever publishes a release, not to the repository. See the "Signing" section at the bottom
# of this file for exactly what to add when you have certificates.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: web bundle and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci --prefix mcp
      - name: type check
        run: npx tsc --noEmit -p tsconfig.json
      - name: build
        run: npm run build
      - name: the two MCP servers agree with mcp/tools.json
        run: npm run test:mcp
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist/

  native:
    name: native checks (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/e57-wasm -> target
      - name: analysis, shapes and point-to-triangle against known answers
        run: cargo run --release --bin anatest --manifest-path crates/e57-wasm/Cargo.toml

  desktop:
    name: desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   name: macOS,   target: aarch64-apple-darwin }
          - { os: windows-latest, name: Windows, target: x86_64-pc-windows-msvc }
          - { os: ubuntu-22.04,   name: Linux,   target: x86_64-unknown-linux-gnu }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
      # webkit2gtk is the webview on Linux; the others ship one with the OS
      - name: Linux webview dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev
      - run: npm ci
      - run: npm ci --prefix mcp
      - name: build the app
        run: npm run desktop:build -- --target ${{ matrix.target }}
      - name: the built binary serves the same MCP tools
        shell: bash
        run: |
          BIN=desktop/target/${{ matrix.target }}/release/e57view
          [ -f "$BIN" ] || BIN=desktop/target/${{ matrix.target }}/release/e57view.exe
          E57VIEW_BIN="$BIN" node test-mcp.mjs --rust
      - uses: actions/upload-artifact@v4
        with:
          name: e57view-${{ matrix.name }}
          path: |
            desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/target/${{ matrix.target }}/release/bundle/deb/*.deb
            desktop/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
          if-no-files-found: warn

# ---------------------------------------------------------------------------
# Signing and notarisation, when you have certificates
# ---------------------------------------------------------------------------
# macOS — add these repository secrets and the Tauri action signs and notarises for you:
#   APPLE_CERTIFICATE            base64 of a Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD   the .p12 password
#   APPLE_SIGNING_IDENTITY       "Developer ID Application: Your Name (TEAMID)"
#   APPLE_ID, APPLE_PASSWORD     an Apple ID and an app-specific password
#   APPLE_TEAM_ID                your team id
# then add `"macOS": { "signingIdentity": "-" }` removal and pass the secrets as env to the
# build step. Without them the .app is unsigned: macOS will refuse the first open, and the
# user has to right-click -> Open once, or run
#   xattr -dr com.apple.quarantine /Applications/e57view.app
#
# Windows — sign the NSIS installer with signtool, or set
#   bundle.windows.certificateThumbprint and bundle.windows.digestAlgorithm in tauri.conf.json
# with the certificate installed on the runner. Unsigned, SmartScreen warns on first run.
#
# Linux — AppImage and .deb are not signed by convention; publish sha256 sums alongside.

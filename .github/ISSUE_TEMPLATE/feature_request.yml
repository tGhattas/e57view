name: Feature request
description: Something it should be able to do
labels: [enhancement]
body:
  - type: textarea
    id: what
    attributes:
      label: What you want to do
      description: The task, not the button. "Measure clearance under a beam" tells us more than "add a measure tool".
    validations: { required: true }
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Another tool, a workaround, or not at all.
  - type: textarea
    id: check
    attributes:
      label: How we would know it works
      description: Every feature here ships with a driver that measures something with a known answer. What would yours measure?
